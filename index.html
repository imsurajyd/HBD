<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff5f7" />

  <!-- Google Fonts (Unchanged) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&display=swap"
    rel="stylesheet">

  <!-- Dynamic Tab Title Script -->
  <title>HBD... 🎀🎂</title>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var name = params.get("name");
        if (name && name.trim()) {
          document.title = "Something Special For " + decodeURIComponent(name.trim()) + " 🎀✨";
        }
      } catch (e) { }
    })();
  </script>

  <!-- WhatsApp, Instagram & Facebook Preview Cards -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Something Beautiful Is Coming... 🎀✨" />
  <meta property="og:description"
    content="A little surprise made just for you, my love ❤️ Tap to open your birthday surprise!" />
  <meta property="og:image" content="/preview.webp" />

  <!-- Twitter / X Preview Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Something Beautiful Is Coming... 🎀✨" />
  <meta name="twitter:description" content="A little surprise made just for you, my love ❤️" />
  <meta name="twitter:image" content="/preview.webp" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
